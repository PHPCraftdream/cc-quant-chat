name: ci

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: line limit (max 500 lines per source file)
        run: go run ./tools/linelimit
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: test (race detector)
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: "journal at scale (100k messages, sizes and start times)"
        if: runner.os == 'Linux'
        env:
          CCQC_SCALE: "1"
        run: go test ./internal/store/sqlite -run TestJournalScale -v -count=1 -timeout 30m
      - name: build
        run: go build ./...

      - name: installer (sh) — lint, install from source, uninstall
        if: runner.os == 'Linux'
        run: |
          set -eu
          shellcheck install.sh
          sh install.sh --source --dir "$RUNNER_TEMP/ccqc-bin"
          "$RUNNER_TEMP/ccqc-bin/ccqc" version
          sh install.sh --uninstall --dir "$RUNNER_TEMP/ccqc-bin"
          test ! -e "$RUNNER_TEMP/ccqc-bin/ccqc"

      - name: installer (PowerShell) — parse, install from source
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors; exit 1 }
          .\install.ps1 -FromSource -NoPath -Dir "$env:RUNNER_TEMP\ccqc-bin"
          & "$env:RUNNER_TEMP\ccqc-bin\ccqc.exe" version
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: installer (cmd) — uninstall through the wrapper
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call install.cmd -Uninstall -NoPath -Dir "%RUNNER_TEMP%\ccqc-bin" || exit /b 1
          if exist "%RUNNER_TEMP%\ccqc-bin\ccqc.exe" exit /b 1

  # The chat-card mod (plugin-ui): validated and tested by Claude Code itself, pinned to the
  # version whose API declarations the mod was written against (the API is early access).
  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.322
      - name: validate the mod and the marketplace
        run: |
          claude plugin validate plugin-ui
          claude plugin validate .
      - name: mod tests
        run: claude plugin test plugin-ui

  # The client secret A in the key stores of macOS and Linux, against the real tools (the unit tests only stand in for
  # them). CCQC_LIVE_KEYSTORE says which store the test is to use; if it does not work the job fails, it is not skipped.
  keystore-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: a keychain of its own, unlocked, the default one
        run: |
          set -eu
          kc="$RUNNER_TEMP/ccqc-test.keychain-db"
          security create-keychain -p "" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "" "$kc"
          security default-keychain -d user -s "$kc"
          security list-keychains -d user -s "$kc"
          security list-keychains -d user
      - name: live key store (security)
        env:
          CCQC_LIVE_KEYSTORE: keychain
        run: go test ./internal/local -run TestLiveKeyStore -v -count=1

  keystore-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: libsecret-tools and gnome-keyring
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-tools gnome-keyring dbus-x11
      - name: live key store (secret-tool), a session bus and a keyring unlocked with an empty password
        env:
          CCQC_LIVE_KEYSTORE: secret-service
        run: |
          dbus-run-session -- bash -c '
            set -eu
            eval "$(echo -n "" | gnome-keyring-daemon --unlock --components=secrets)"
            export GNOME_KEYRING_CONTROL
            secret-tool --version || true
            go test ./internal/local -run TestLiveKeyStore -v -count=1
          '
